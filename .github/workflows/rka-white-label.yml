name: RKA Upgrade Checks

on:
  pull_request:
  push:
    branches: [main, feature/white-label-rka-platform, 'codex/**']

permissions:
  contents: read

jobs:
  application:
    name: PHP 8.4 / SQLite / build / browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, zip, gd, intl, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: find app database tests routes config scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare isolated environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - run: npm ci
      - run: composer audit
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - name: Full SQLite regression suite
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test
      - name: Compile views, routes, and configuration
        run: |
          php artisan view:cache
          php artisan route:cache
          php artisan config:cache
          php artisan schedule:list
          php artisan list --raw | grep -F 'rka:audit-legacy'
          php artisan optimize:clear
      - name: Non-destructive migration rehearsal
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/ci_upgrade_test.sqlite
        run: bash scripts/ci-verify-rka-upgrade.sh
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser regression
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  mysql:
    name: PHP 8.4 / MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: rka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rka_test
      DB_USERNAME: root
      DB_PASSWORD: test-password
      CACHE_DRIVER: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, zip, gd, intl, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Full MySQL regression suite
        run: php artisan test
      - name: Concurrent financial updates
        run: RKA_CONCURRENCY_TEST=1 php scripts/verify-rka-concurrency.php
      - name: Non-destructive migration rehearsal
        run: bash scripts/ci-verify-rka-upgrade.sh
